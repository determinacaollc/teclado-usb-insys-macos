<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teclado USB Mac - insys KY1-K211</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f6fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5c667a;
      --border: #d5dce8;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 1720px);
      margin: 0 auto;
      padding: 28px 20px 36px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 3vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .brand {
      width: 122px;
      height: auto;
      object-fit: contain;
    }

    .stage {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 8px 28px rgba(23, 32, 51, .08);
    }

    .layout {
      display: block;
      width: 1700px;
      height: auto;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    a {
      color: var(--accent);
    }

    .button {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Teclado USB Mac</h1>
        <p>Layout do teclado USB insys KY1-K211 adaptado para macOS.</p>
      </div>
      <img class="brand" src="assets/insys-logo.png" alt="insys">
    </header>

    <section class="stage" aria-label="Layout do teclado">
      <img class="layout" src="assets/teclado-usb-mac-layout.svg" alt="Desenho do layout do teclado USB com teclas Mac">
    </section>

    <nav class="actions" aria-label="Downloads">
      <a class="button" href="assets/teclado-usb-mac-layout.pdf">Abrir PDF</a>
      <a class="button" href="../scripts/apply-usb-keyboard-remap.sh">Script hidutil</a>
      <a class="button" href="../keyboard-layouts/pt_pt.keylayout">Layout pt_PT</a>
    </nav>

    <footer>Copyright © 2026 Determinação LLC. Todos os direitos reservados.</footer>
  </main>
</body>
</html>
